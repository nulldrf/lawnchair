name: Generate Baseline Profile

on:
  workflow_dispatch:
  push:
    paths:
      - 'lawnchair/src/**/PreferenceScaffold.kt'
      - 'lawnchair/src/**/ScrollContainers.kt'
      - 'baseline-profile/src/**'
      - 'baseline-profile/build.gradle'
      - '.github/workflows/generate_baseline_profile.yml'

concurrency:
  group: generate-baseline-profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    permissions:
      contents: write

    steps:
      - name: Free runner disk space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/share/boost \
            /usr/local/lib/android/sdk/ndk \
            /usr/local/lib/android/sdk/cmake
          df -h

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm || true
          ls -la /dev/kvm

      - name: Accept Android SDK licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Generate Baseline Profile
        run: |
          cat > /tmp/maven-mirror.init.gradle << 'EOF'
          gradle.beforeSettings { settings ->
              [settings.pluginManagement.repositories, settings.dependencyResolutionManagement.repositories].each { repos ->
                  repos.all { repo ->
                      if (repo instanceof MavenArtifactRepository &&
                          repo.url.toString().startsWith("https://repo.maven.apache.org/maven2")) {
                          repo.url = URI.create("https://maven-central.storage-download.googleapis.com/maven2/")
                      }
                  }
              }
          }
          EOF
          ./gradlew :copyBaselineProfileIntoSrc \
            --init-script /tmp/maven-mirror.init.gradle \
            --no-configuration-cache \
            -Pandroid.testoptions.manageddevices.emulator.gpu="swiftshader_indirect" \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
            -Pkotlin.daemon.jvm.options="-Xmx2g" \
            --max-workers=2 \
            --stacktrace
          ls -lh src/main/generated/baselineProfiles/baseline-prof.txt
          wc -l src/main/generated/baselineProfiles/baseline-prof.txt
          test -s src/main/generated/baselineProfiles/baseline-prof.txt

      - name: Upload baseline-prof.txt as artifact
        uses: actions/upload-artifact@v7
        with:
          name: baseline-prof
          path: src/main/generated/baselineProfiles/baseline-prof.txt
          if-no-files-found: error

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: baseline-profile-failure-logs
          path: |
            baseline-profile/build/outputs/androidTest-results/**
            baseline-profile/build/outputs/managed_device_android_test_additional_output/**
          if-no-files-found: ignore
